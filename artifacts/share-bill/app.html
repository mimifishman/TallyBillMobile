    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!--
      iOS Smart App Banner: Safari shows "Open" when the app is installed and
      "Get" when it is not. app-argument is this bill's own URL, so the app
      opens straight to it. Written here, not in React, because Safari reads
      the tag while it parses the page.
      See: https://developer.apple.com/documentation/webkit/promoting_apps_with_smart_app_banners
    -->
    <script>
      (function () {
        var meta = document.createElement("meta");
        meta.name = "apple-itunes-app";
        meta.content = "app-id=6800714204, app-argument=" + location.origin + location.pathname;
        document.head.appendChild(meta);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
