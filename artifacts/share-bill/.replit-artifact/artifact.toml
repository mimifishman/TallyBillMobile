kind = "web"
previewPath = "/"
title = "TallyBill"
version = "1.0.0"
id = "artifacts/share-bill"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25729

[services.development]
run = "pnpm --filter @workspace/share-bill run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/share-bill", "run", "build" ]
publicDir = "artifacts/share-bill/dist/public"
serve = "static"

# iOS reads this file to trust tallybill.app links, so /b/ links open the app.
[[services.production.rewrites]]
from = "/.well-known/apple-app-site-association"
to = "/apple-app-site-association.json"

# Android reads this file to verify tallybill.app links (autoVerify), so
# /b/ links open the app instead of the browser. The fingerprint is the
# EAS release signing key for app.tallybill.
[[services.production.rewrites]]
from = "/.well-known/assetlinks.json"
to = "/assetlinks.json"

[[services.production.rewrites]]
from = "/b/*"
to = "/app.html"

[services.env]
PORT = "25729"
BASE_PATH = "/"
