kind = "web"
previewPath = "/b/"
title = "TallyBill Share"
version = "1.0.0"
id = "artifacts/share-bill"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/b/" ]
localPort = 25729

[services.development]
run = "pnpm --filter @workspace/share-bill run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/share-bill", "run", "build" ]
publicDir = "artifacts/share-bill/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25729"
BASE_PATH = "/b/"
