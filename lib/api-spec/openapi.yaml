openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: bills
    description: Bill management
  - name: bill-members
    description: Bill participants
  - name: bill-lines
    description: Bill line items
  - name: ocr
    description: Receipt OCR
  - name: currency
    description: Currency detection

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: Change the authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills:
    get:
      operationId: getBills
      tags: [bills]
      summary: Get user's bills
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bill"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBill
      tags: [bills]
      summary: Create a new bill
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/join:
    post:
      operationId: joinBill
      tags: [bills]
      summary: Join a bill by code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinBillRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/by-code/{joinCode}:
    get:
      operationId: getBillByCode
      tags: [bills]
      summary: Get a bill by its join code (no auth required — capability via code)
      parameters:
        - name: joinCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bills/{billId}:
    get:
      operationId: getBill
      tags: [bills]
      summary: Get a bill by ID
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateBill
      tags: [bills]
      summary: Update a bill
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
    patch:
      operationId: patchBill
      tags: [bills]
      summary: Edit bill header (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBillRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the bill owner can edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBill
      tags: [bills]
      summary: Delete a bill
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No content

  /bills/{billId}/lines:
    get:
      operationId: getBillLines
      tags: [bill-lines]
      summary: Get bill line items
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillLine"
    post:
      operationId: createBillLine
      tags: [bill-lines]
      summary: Add a line item
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillLineRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillLine"

  /bills/{billId}/lines/bulk:
    post:
      operationId: bulkCreateBillLines
      tags: [bill-lines]
      summary: Bulk create line items (from OCR)
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lines:
                  type: array
                  items:
                    $ref: "#/components/schemas/CreateBillLineRequest"
              required:
                - lines
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillLine"

  /bills/{billId}/lines/{lineId}:
    put:
      operationId: updateBillLine
      tags: [bill-lines]
      summary: Update a line item
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
        - name: lineId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillLineRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillLine"
    delete:
      operationId: deleteBillLine
      tags: [bill-lines]
      summary: Delete a line item
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
        - name: lineId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No content

  /bills/{billId}/lines/{lineId}/users:
    post:
      operationId: toggleBillLineUser
      tags: [bill-lines]
      summary: Assign or unassign a bill user to a line item
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
        - name: lineId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                billUserId:
                  type: integer
              required:
                - billUserId
      responses:
        "200":
          description: OK (assigned = true, unassigned = false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  assigned:
                    type: boolean
                required:
                  - assigned

  /bills/{billId}/users:
    get:
      operationId: getBillUsers
      tags: [bill-members]
      summary: Get bill participants
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillMember"
    post:
      operationId: createBillUser
      tags: [bill-members]
      summary: Add a participant
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillMemberRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillMember"

  /bills/{billId}/users/{userId}:
    put:
      operationId: updateBillUser
      tags: [bill-members]
      summary: Update a participant (e.g. tipPercentOverride)
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillMemberRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillMember"
    delete:
      operationId: deleteBillUser
      tags: [bill-members]
      summary: Remove a participant
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No content

  /bills/{billId}/totals:
    get:
      operationId: getBillTotals
      tags: [bills]
      summary: Get per-person totals
      parameters:
        - name: billId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillTotals"

  /ocr:
    post:
      operationId: ocrReceipt
      tags: [ocr]
      summary: Parse a receipt image via Veryfi OCR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageBase64:
                  type: string
                  description: Base64-encoded image
                fileName:
                  type: string
              required:
                - imageBase64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrResult"
        "500":
          description: OCR failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ocr/translate:
    post:
      operationId: ocrTranslate
      tags: [ocr]
      summary: Translate scanned receipt item descriptions into a target language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrTranslateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrTranslateResponse"
        "500":
          description: Translation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /currency:
    get:
      operationId: detectCurrency
      tags: [currency]
      summary: Detect currency from IP
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        displayName:
          type: string
      required:
        - email
        - password
        - displayName

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - displayName
        - createdAt

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
      required:
        - currentPassword
        - newPassword

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    Bill:
      type: object
      properties:
        id:
          type: integer
        ownerUserId:
          type: integer
          nullable: true
        title:
          type: string
        date:
          type: string
        currency:
          type: string
          nullable: true
        taxPercent:
          type: number
        tipPercent:
          type: number
        joinCode:
          type: string
        createdAt:
          type: string
          format: date-time
        receiptImagePath:
          type: string
          nullable: true
          description: Object storage path of the scanned receipt image
        settled:
          type: boolean
          description: True when every line item on the bill has been assigned to at least one person
        isOwner:
          type: boolean
          description: True when the authenticated user is the owner of this bill
        users:
          type: array
          description: Lightweight participant summary for list rendering (id, name, color)
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              color:
                type: string
            required:
              - id
              - name
              - color
      required:
        - id
        - title
        - date
        - taxPercent
        - tipPercent
        - joinCode
        - createdAt

    BillDetail:
      type: object
      properties:
        bill:
          $ref: "#/components/schemas/Bill"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/BillLine"
        users:
          type: array
          items:
            $ref: "#/components/schemas/BillMember"
        isOwner:
          type: boolean
        ownerName:
          type: string
          description: Display name of the bill owner, or "Guest" for guest-created bills
      required:
        - bill
        - lines
        - users
        - isOwner
        - ownerName

    CreateBillRequest:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        currency:
          type: string
          nullable: true
        taxPercent:
          type: number
        tipPercent:
          type: number
      required:
        - title
        - date
        - taxPercent
        - tipPercent

    UpdateBillRequest:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        currency:
          type: string
          nullable: true
        taxPercent:
          type: number
        tipPercent:
          type: number

    PatchBillRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        date:
          type: string
        currency:
          type: string
          nullable: true
        taxPercent:
          type: number
        tipPercent:
          type: number
        receiptImagePath:
          type: string
          nullable: true
          description: Object storage path of the scanned receipt image

    JoinBillRequest:
      type: object
      properties:
        joinCode:
          type: string
      required:
        - joinCode

    BillMember:
      type: object
      properties:
        id:
          type: integer
        billId:
          type: integer
        name:
          type: string
        color:
          type: string
        tipPercentOverride:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - billId
        - name
        - color
        - createdAt

    CreateBillMemberRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
      required:
        - name
        - color

    UpdateBillMemberRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
        tipPercentOverride:
          type: number
          nullable: true

    BillLine:
      type: object
      properties:
        id:
          type: integer
        billId:
          type: integer
        description:
          type: string
        originalDescription:
          type: string
          nullable: true
          description: The original (untranslated) item description if the item was translated from a foreign-language receipt
        quantity:
          type: number
        unitPrice:
          type: number
        total:
          type: number
        position:
          type: number
          nullable: true
        assignedUserIds:
          type: array
          items:
            type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - billId
        - description
        - quantity
        - unitPrice
        - total
        - assignedUserIds
        - createdAt

    CreateBillLineRequest:
      type: object
      properties:
        description:
          type: string
        originalDescription:
          type: string
          nullable: true
          description: The original (untranslated) item description if translated from a foreign-language receipt
        quantity:
          type: number
        unitPrice:
          type: number
        total:
          type: number
        afterLineId:
          type: integer
          nullable: true
      required:
        - description
        - quantity
        - unitPrice
        - total

    OcrTranslateRequest:
      type: object
      properties:
        descriptions:
          type: array
          items:
            type: string
          description: Array of item description strings to translate
        targetLanguage:
          type: string
          description: Target language name (e.g. "French", "Spanish")
      required:
        - descriptions
        - targetLanguage

    OcrTranslateResponse:
      type: object
      properties:
        translations:
          type: array
          items:
            type: string
          description: Translated descriptions in the same order as the input
      required:
        - translations

    PersonTotalItem:
      type: object
      properties:
        billLineId:
          type: integer
        description:
          type: string
        lineTotal:
          type: number
          description: The original (full) price of the line item
        share:
          type: number
          description: This person's share of the line item
        splitWithNames:
          type: array
          description: Names of other people the line was split with (excludes this person)
          items:
            type: string
      required:
        - billLineId
        - description
        - lineTotal
        - share
        - splitWithNames

    PersonTotal:
      type: object
      properties:
        billUserId:
          type: integer
        name:
          type: string
        color:
          type: string
        subtotal:
          type: number
        taxShare:
          type: number
        tipPercent:
          type: number
        tipAmount:
          type: number
        tipIsCustom:
          type: boolean
        total:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonTotalItem"
      required:
        - billUserId
        - name
        - color
        - subtotal
        - taxShare
        - tipPercent
        - tipAmount
        - tipIsCustom
        - total
        - items

    UnsplitLine:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        total:
          type: number
      required:
        - id
        - description
        - total

    BillTotals:
      type: object
      properties:
        billSubtotal:
          type: number
        taxPercent:
          type: number
        taxAmount:
          type: number
        tipPercent:
          type: number
        tipAmount:
          type: number
        averageTipPercent:
          type: number
        grandTotal:
          type: number
        perPerson:
          type: array
          items:
            $ref: "#/components/schemas/PersonTotal"
        settled:
          type: boolean
          description: True when the bill has at least one person, at least one line item, and every line item is assigned to at least one person
        unsplitLines:
          type: array
          description: Line items that have not been assigned to anyone
          items:
            $ref: "#/components/schemas/UnsplitLine"
      required:
        - billSubtotal
        - taxPercent
        - taxAmount
        - tipPercent
        - tipAmount
        - averageTipPercent
        - grandTotal
        - perPerson
        - settled
        - unsplitLines

    OcrLineItem:
      type: object
      properties:
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        total:
          type: number
      required:
        - description
        - quantity
        - unitPrice
        - total

    OcrResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OcrLineItem"
        taxAmount:
          type: number
          nullable: true
        tipAmount:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true
      required:
        - items

    CurrencyResponse:
      type: object
      properties:
        currency:
          type: string
        countryCode:
          type: string
      required:
        - currency
        - countryCode
