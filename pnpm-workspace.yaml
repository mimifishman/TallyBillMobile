# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. Replit packsges, react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # Exclude @replit scoped packages from the minimum release age check.
  # These are published by Replit and trusted — the supply-chain attack vector
  # this setting guards against does not apply to our own packages.
  - '@replit/*'
  - stripe-replit-sync

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ~19.1.17
  '@types/react-dom': ~19.1.11
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # WEB-ONLY pin: @clerk/* peers (clerk-react, shared) prefer ~19.1.4+, so web
  # apps use 19.1.9. The mobile app must NOT use this entry — React Native
  # 0.81's bundled react-native-renderer is built against react 19.1.0 exactly
  # and React crashes at startup ("Incompatible React versions" red screen in
  # Expo Go) on any other patch. Mobile uses the `mobile` named catalog below.
  react: 19.1.9
  # See comment on `react` above — web-only; mobile uses the `mobile` catalog.
  react-dom: 19.1.9
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

catalogs:
  # MOBILE-ONLY React pin. React Native 0.81 ships react-native-renderer
  # 19.1.0 and React enforces an EXACT version match at runtime — any other
  # react patch (e.g. 19.1.9) crashes Expo Go at startup with an
  # "Incompatible React versions" red screen. @clerk/* peer warnings about
  # preferring react ~19.1.4+ are install-time noise only (see
  # peerDependencyRules below) and must NEVER be "fixed" by bumping this pin.
  mobile:
    react: 19.1.0
    react-dom: 19.1.0

autoInstallPeers: false

peerDependencyRules:
  # The mobile app pins react/react-dom to exactly 19.1.0 because React
  # Native 0.81's renderer requires an exact runtime match (see the `mobile`
  # named catalog above). @clerk/* peers declare ~19.1.4+, which would emit
  # unmet-peer warnings; allow 19.1.x explicitly so installs stay quiet.
  # Do NOT resolve any future @clerk peer warning by moving mobile react off
  # 19.1.0 — that reintroduces the Expo Go startup crash.
  allowedVersions:
    '@clerk/expo>react': '19'
    '@clerk/react>react': '19'
    '@clerk/react>react-dom': '19'
    '@clerk/shared>react': '19'
    '@clerk/shared>react-dom': '19'

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

