<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#15803D"/>
      <stop offset="100%" style="stop-color:#16A34A"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#16A34A;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle receipt watermark lines - diagonal decoration -->
  <g opacity="0.06" transform="rotate(-15, 600, 315)">
    <rect x="-200" y="60" width="1600" height="18" rx="9" fill="white"/>
    <rect x="-200" y="120" width="1600" height="18" rx="9" fill="white"/>
    <rect x="-200" y="180" width="1600" height="18" rx="9" fill="white"/>
    <rect x="-200" y="240" width="1600" height="18" rx="9" fill="white"/>
    <rect x="-200" y="300" width="1600" height="18" rx="9" fill="white"/>
    <rect x="-200" y="360" width="1600" height="18" rx="9" fill="white"/>
    <rect x="-200" y="420" width="1600" height="18" rx="9" fill="white"/>
    <rect x="-200" y="480" width="1600" height="18" rx="9" fill="white"/>
    <rect x="-200" y="540" width="1600" height="18" rx="9" fill="white"/>
    <rect x="-200" y="600" width="1600" height="18" rx="9" fill="white"/>
    <rect x="-200" y="660" width="1600" height="18" rx="9" fill="white"/>
    <rect x="-200" y="720" width="1600" height="18" rx="9" fill="white"/>
  </g>

  <!-- Logo mark centered -->
  <g transform="translate(448, 135) scale(3.04)">
    <rect x="12" y="8" width="76" height="84" rx="12" fill="rgba(255,255,255,0.18)"/>
    <line x1="50" y1="20" x2="50" y2="82" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-dasharray="5,3.5"/>
    <rect x="20" y="28" width="22" height="5" rx="2.5" fill="white" opacity="0.92"/>
    <rect x="20" y="41" width="18" height="5" rx="2.5" fill="white" opacity="0.92"/>
    <rect x="20" y="54" width="22" height="5" rx="2.5" fill="white" opacity="0.92"/>
    <rect x="20" y="67" width="14" height="5" rx="2.5" fill="white" opacity="0.92"/>
    <rect x="58" y="28" width="22" height="5" rx="2.5" fill="white" opacity="0.92"/>
    <rect x="58" y="41" width="17" height="5" rx="2.5" fill="white" opacity="0.92"/>
    <rect x="58" y="54" width="22" height="5" rx="2.5" fill="white" opacity="0.92"/>
    <rect x="58" y="67" width="16" height="5" rx="2.5" fill="white" opacity="0.92"/>
    <rect x="20" y="78" width="60" height="5" rx="2.5" fill="white" opacity="0.6"/>
  </g>

  <!-- TallyBill wordmark -->
  <text x="600" y="430" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="96" fill="white" letter-spacing="-2" text-anchor="middle">TallyBill</text>

  <!-- Tagline -->
  <text x="600" y="498" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="38" fill="rgba(255,255,255,0.82)" letter-spacing="0.5" text-anchor="middle">Split bills. Not friendships.</text>
</svg>
